name: BG Route Discovery

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show files and branch
        run: |
          pwd
          git branch --show-current
          ls -la
          find . -name "bg_route_probe*.py"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Check BG routes
        run: |
          python ./bg_route_probe.py 2026-11-15 8
          python ./bg_route_probe.py 2026-11-20 8
          python ./bg_route_probe.py 2026-11-25 9
